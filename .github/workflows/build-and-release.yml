name: Android Build & Auto Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Auto Version Bump
        id: version_bump
        run: |
          if [ -f version.properties ]; then
            VERSION_CODE=$(grep '^VERSION_CODE=' version.properties | cut -d'=' -f2 | tr -d '\r')
            VERSION_NAME=$(grep '^VERSION_NAME=' version.properties | cut -d'=' -f2 | tr -d '\r')
          else
            VERSION_CODE=1
            VERSION_NAME="1.0.0"
          fi

          VERSION_CODE=${VERSION_CODE:-1}
          VERSION_NAME=${VERSION_NAME:-"1.0.0"}

          # Increment version code
          NEW_VERSION_CODE=$((VERSION_CODE + 1))

          # Increment patch version number (MAJOR.MINOR.PATCH)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION_NAME="${MAJOR}.${MINOR}.${NEW_PATCH}"

          echo "Bumping version from ${VERSION_NAME} (code ${VERSION_CODE}) to ${NEW_VERSION_NAME} (code ${NEW_VERSION_CODE})"

          # Update version.properties
          echo "VERSION_CODE=${NEW_VERSION_CODE}" > version.properties
          echo "VERSION_NAME=${NEW_VERSION_NAME}" >> version.properties

          echo "new_version_code=${NEW_VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "new_version_name=${NEW_VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=v${NEW_VERSION_NAME}" >> $GITHUB_OUTPUT

      - name: Commit Version Bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore(release): bump version to ${{ steps.version_bump.outputs.new_version_name }} [skip ci]" || echo "No version changes to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "Push skipped"

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Package APK Outputs
        run: |
          mkdir -p release_outputs
          cp app/build/outputs/apk/debug/app-debug.apk release_outputs/FinishLine-v${{ steps.version_bump.outputs.new_version_name }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk release_outputs/FinishLine-latest.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./FinishLine-debug.apk

      - name: Create GitHub Tag & Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version_bump.outputs.new_version_name }}
          name: FinishLine Release v${{ steps.version_bump.outputs.new_version_name }}
          body: |
            ## FinishLine Sprint Timing Release v${{ steps.version_bump.outputs.new_version_name }}
            - **Version Code**: `${{ steps.version_bump.outputs.new_version_code }}`
            - **Commit SHA**: `${{ github.sha }}`
            - **Automated Build**: GitHub Actions Workflow
            
            ### Downloads
            - `FinishLine-v${{ steps.version_bump.outputs.new_version_name }}.apk`
            - `FinishLine-latest.apk`
          files: |
            release_outputs/FinishLine-v${{ steps.version_bump.outputs.new_version_name }}.apk
            release_outputs/FinishLine-latest.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinishLine-v${{ steps.version_bump.outputs.new_version_name }}-APK
          path: release_outputs/*
